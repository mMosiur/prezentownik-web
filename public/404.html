<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <title>Prezentownik</title>
    <!--
      GitHub Pages only serves static files and has no server-side rewrites,
      so any direct request to a deep link (e.g. /prezentownik-web/lists/123)
      would normally return this 404 page. Instead, we encode the requested
      path into the query string and redirect to the app's index.html, which
      restores the original URL before the router takes over.
      Based on the well-known spa-github-pages technique:
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1 // number of segments in the repo base path, e.g. "/prezentownik-web"

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body>
  </body>
</html>
