<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="%BASE_URL%favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezentownik</title>
    <!--
      Counterpart to public/404.html: restores the deep link that was
      redirected here (e.g. "/prezentownik-web/?/lists/123") back into a
      normal URL ("/prezentownik-web/lists/123") before the router mounts,
      so GitHub Pages can serve deep links without a real server rewrite.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
