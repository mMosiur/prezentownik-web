<!DOCTYPE html>

  <head>
    <meta charset="UTF-8">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="manifest" href="/site.webmanifest">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>Prezentownik – Dyskretna lista prezentów</title>
    <meta name="title" content="Prezentownik – Dyskretna lista prezentów">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://prezentownik.info.pl/">
    <meta property="og:site_name" content="Prezentownik">
    <meta property="og:title" content="Prezentownik – Dyskretna lista prezentów">
    <meta property="og:description" content="Zapomnij o nietrafionych lub zdublowanych prezentach - twórz listy prezentów, dziel się nimi z bliskimi i rezerwuj upominki bez wglądu w jej zawartość autora.">
    <meta property="og:image" content="https://prezentownik.info.pl/og-image.png">
    <meta property="og:image:secure_url" content="https://prezentownik.info.pl/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="857">
    <meta property="og:image:height" content="450">
    <meta property="og:image:alt" content="Prezentownik - Dyskretna lista prezentów">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://prezentownik.info.pl/">
    <meta name="twitter:title" content="Prezentownik – Dyskretna lista prezentów">
    <meta name="twitter:description" content="Zapomnij o nietrafionych lub zdublowanych prezentach - twórz listy prezentów, dziel się nimi z bliskimi i rezerwuj upominki bez wglądu w jej zawartość autora.">
    <meta name="twitter:image" content="https://prezentownik.info.pl/og-image.png">

    <!--
      Counterpart to public/404.html: restores the deep link that was
      redirected here (e.g. "/prezentownik-web/?/lists/123") back into a
      normal URL ("/prezentownik-web/lists/123") before the router mounts,
      so GitHub Pages can serve deep links without a real server rewrite.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      }(window.location))
    </script>
    <style>
      .app-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background-color: hsl(40, 40%, 97%);
        color: #4f6d68;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .app-preloader-logo {
        width: 56px;
        height: 56px;
        animation: preloader-pulse 1.8s ease-in-out infinite;
      }
      .app-preloader-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(79, 109, 104, 0.2);
        border-top-color: #4f6d68;
        border-radius: 50%;
        animation: preloader-spin 0.8s linear infinite;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.06); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-preloader" aria-busy="true" aria-label="Loading">
        <img src="/favicon.svg" alt="Prezentownik" class="app-preloader-logo">
        <div class="app-preloader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
